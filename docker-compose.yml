version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: auth_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: auth_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d auth_db']
      interval: 5s
      timeout: 5s
      retries: 5

  # Node.js Auth Backend Application
  auth_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth_backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: production
      PORT: 5000
      API_PREFIX: /api/v1
      APP_URL: http://localhost:5000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/auth_db?schema=public
      JWT_ACCESS_SECRET: super_secure_jwt_access_secret_key_production_32chars
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: super_secure_jwt_refresh_secret_key_production_32chars
      JWT_REFRESH_EXPIRES_IN: 7d
      PASSWORD_RESET_TOKEN_EXPIRES_IN_MINUTES: 15
      COOKIE_SECRET: super_cookie_secret_key_production
      COOKIE_SECURE: "false"
      EMAIL_SERVICE: mock
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network

volumes:
  postgres_data:
    driver: local

networks:
  app_network:
    driver: bridge
